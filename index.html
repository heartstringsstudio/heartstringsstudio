<script>
/* SCROLL REVEAL */
(function() {
  var observerOptions = { threshold: 0.12, rootMargin: '0px 0px -60px 0px' };
  var revealObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, observerOptions);
  document.querySelectorAll('.reveal, .reveal-stagger, .ornament-divider').forEach(function(el) {
    revealObserver.observe(el);
  });
})();

/* STAT COUNT-UP */
(function() {
  var stats = document.querySelectorAll('.proof-stat[data-count]');
  if (!stats.length) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  function format(n, suffix) { return Math.round(n).toLocaleString('en-US') + suffix; }

  function animate(el) {
    var target = parseFloat(el.getAttribute('data-count'));
    var suffix = el.getAttribute('data-suffix') || '';
    var dur = 1800, start = null;
    function ease(t) { return 1 - Math.pow(1 - t, 4); } /* easeOutQuart */
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      el.textContent = format(target * ease(p), suffix);
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = format(target, suffix);
    }
    requestAnimationFrame(step);
  }

  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        animate(entry.target);
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });

  stats.forEach(function(el) {
    obs.observe(el);
  });
})();

/* FAQ ACCORDION */
(function() {
  var items = document.querySelectorAll('.faq-item');
  if (!items.length) return;

  function close(item) {
    item.classList.remove('open');
    var a = item.querySelector('.faq-a');
    var q = item.querySelector('.faq-q');
    if (a) a.style.maxHeight = null;
    if (q) q.setAttribute('aria-expanded', 'false');
  }

  items.forEach(function(item) {
    var q = item.querySelector('.faq-q');
    var a = item.querySelector('.faq-a');
    if (!q || !a) return;
    q.setAttribute('role', 'button');
    q.setAttribute('tabindex', '0');
    q.setAttribute('aria-expanded', 'false');

    function toggle() {
      var willOpen = !item.classList.contains('open');
      items.forEach(function(other) { if (other !== item) close(other); });
      if (willOpen) {
        item.classList.add('open');
        a.style.maxHeight = a.scrollHeight + 'px';
        q.setAttribute('aria-expanded', 'true');
      } else {
        close(item);
      }
    }

    q.addEventListener('click', toggle);
    q.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        toggle();
      }
    });
  });

  window.addEventListener('resize', function() {
    document.querySelectorAll('.faq-item.open .faq-a').forEach(function(a) {
      a.style.maxHeight = a.scrollHeight + 'px';
    });
  });
})();

/* TESTIMONIAL CAROUSEL */
(function() {
  var root = document.querySelector('.testimonial-carousel');
  if (!root) return;
  var track = root.querySelector('.t-track');
  var slides = Array.prototype.slice.call(root.querySelectorAll('.testimonial'));
  var dotsWrap = root.querySelector('.carousel-dots');
  var prev = root.querySelector('.carousel-arrow.prev');
  var next = root.querySelector('.carousel-arrow.next');
  if (!track || slides.length < 2) return;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var index = 0, timer = null, DELAY = 6500;

  var dots = slides.map(function(_, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', 'Testimonial ' + (i + 1));
    b.addEventListener('click', function() { goTo(i); restart(); });
    dotsWrap.appendChild(b);
    return b;
  });

  function update() {
    track.style.transform = 'translateX(' + (-index * 100) + '%)';
    dots.forEach(function(d, i) { d.setAttribute('aria-selected', i === index ? 'true' : 'false'); });
    slides.forEach(function(s, i) { s.setAttribute('aria-hidden', i === index ? 'false' : 'true'); });
  }
  function goTo(i) { index = (i + slides.length) % slides.length; update(); }
  function nextSlide() { goTo(index + 1); }
  function prevSlide() { goTo(index - 1); }

  function start() { if (!reduce && timer === null) timer = setInterval(nextSlide, DELAY); }
  function stop() { if (timer !== null) { clearInterval(timer); timer = null; } }
  function restart() { stop(); start(); }

  next.addEventListener('click', function() { nextSlide(); restart(); });
  prev.addEventListener('click', function() { prevSlide(); restart(); });

  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', start);
  document.addEventListener('visibilitychange', function() { if (document.hidden) stop(); else start(); });

  root.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); restart(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); restart(); }
  });

  update();
  start();
})();

/* STICKY NAV */
(function() {
  var nav = document.getElementById('stickyNav');
  var hero = document.querySelector('.hero');
  if (!nav || !hero) return;

  var toggle = document.getElementById('navToggle');
  var menu = document.getElementById('navMenu');

  function closeMenu() {
    nav.classList.remove('menu-open');
    if (toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open menu');
    }
  }
  function openMenu() {
    nav.classList.add('menu-open');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Close menu');
  }

  if (toggle && menu) {
    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      nav.classList.contains('menu-open') ? closeMenu() : openMenu();
    });
    /* Close after choosing a section */
    menu.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', closeMenu);
    });
    /* Close on outside tap or Escape */
    document.addEventListener('click', function(e) {
      if (nav.classList.contains('menu-open') && !nav.contains(e.target)) closeMenu();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeMenu();
    });
  }

  /* Nav is always present: transparent over the hero, solid once scrolled */
  function onScroll() {
    if (window.scrollY > 24) {
      nav.classList.add('is-solid');
    } else {
      nav.classList.remove('is-solid');
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

/* ENGAGEMENT TRACKING (scroll depth · section views · CTA clicks) */
(function () {
  if (typeof gtag !== 'function') return;

  /* ---- How far down the page people get: 25 / 50 / 75 / 90 / 100% ---- */
  var marks = [25, 50, 75, 90, 100];
  var fired = {};
  function scrollPct() {
    var doc = document.documentElement, body = document.body;
    var top = window.pageYOffset || doc.scrollTop || body.scrollTop || 0;
    var max = Math.max(body.scrollHeight, doc.scrollHeight) - window.innerHeight;
    if (max <= 0) return 100;
    return Math.min(100, Math.round((top / max) * 100));
  }
  function checkScroll() {
    var p = scrollPct();
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i];
      if (p >= m && !fired[m]) {
        fired[m] = true;
        gtag('event', 'scroll_depth', {
          percent: m,
          event_category: 'engagement',
          event_label: m + '%',
          non_interaction: true
        });
      }
    }
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () { checkScroll(); ticking = false; });
  }, { passive: true });
  checkScroll();

  /* ---- Which sections actually get seen (50% in view) ---- */
  function sectionName(el) {
    if (el.id) return el.id;
    var label = el.querySelector('.section-label, .weekly-badge');
    if (label && label.textContent.trim()) return label.textContent.trim();
    var h = el.querySelector('h1, h2');
    if (h && h.textContent.trim()) return h.textContent.trim().replace(/\s+/g, ' ').slice(0, 60);
    return 'section';
  }
  if ('IntersectionObserver' in window) {
    var seen = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var name = sectionName(entry.target);
        if (seen[name]) return;
        seen[name] = true;
        gtag('event', 'section_view', {
          section: name,
          event_category: 'engagement',
          event_label: name,
          non_interaction: true
        });
      });
    }, { threshold: 0.5 });
    document.querySelectorAll('section').forEach(function (el) { io.observe(el); });
  }

  /* ---- Primary CTA clicks ---- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, a');
    if (!el) return;
    var txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
    var href = el.getAttribute('href') || '';
    if (href.indexOf('/storyroom/') !== -1) {
      gtag('event', 'cta_click', { cta: 'begin_song', event_category: 'engagement', event_label: txt.slice(0, 50) });
      /* The story room lives off-site, so GA can't observe the submit —
         a click through to it is the closest conversion signal we have. */
      var occ = (href.split('occasion=')[1] || '').split('&')[0];
      gtag('event', 'generate_lead', {
        event_category: 'conversion',
        event_label: txt.slice(0, 50),
        occasion: occ ? decodeURIComponent(occ) : 'unspecified'
      });
    } else if (href.indexOf('/jukebox/') !== -1) {
      gtag('event', 'cta_click', { cta: 'hear_songs', event_category: 'engagement', event_label: txt.slice(0, 50) });
    }
  }, true);
})();
</script>
