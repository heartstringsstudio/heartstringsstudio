<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Keepsake Template Retired · Heartstrings Studio</title>
  <style>
    :root { --cream:#faf6f2; --ink:#1a1416; --rose:#c0455a; --muted:#7a6668; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:2rem; background:var(--cream); color:var(--ink); font-family:system-ui,sans-serif; }
    main { max-width:620px; padding:clamp(2rem,6vw,4rem); text-align:center; border:1px solid rgba(192,69,90,.28); background:#fff9; box-shadow:0 24px 60px rgba(58,46,48,.1); }
    img { width:110px; height:110px; object-fit:contain; }
    h1 { margin:.75rem 0; font:500 clamp(2rem,6vw,3.4rem) Georgia,serif; }
    p { color:var(--muted); line-height:1.7; }
    a { display:inline-block; margin-top:1rem; padding:.85rem 1.5rem; color:var(--cream); background:var(--rose); text-decoration:none; }
    a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="" width="110" height="110" />
    <h1>This template has retired.</h1>
    <p>The Keepsake Builder is now the single source of truth. It protects the required MP3, lyric-sheet, privacy, consent, and brand treatments from drifting apart.</p>
    <a href="keepsake-builder.html">Open the Keepsake Builder</a>
  </main>
</body>
</html>
