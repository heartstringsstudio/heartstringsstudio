<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Keepsake Template Retired · Heartstrings Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet" />
  <style>
    :root { --cream:#f4e8d2; --ink:#271c16; --rose:#774826; --muted:#7d6a55; --card:#fffaf0;
             --amber:#edb268; --amber-shadow:#956536; --amber-ink:#291c14; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:2rem; background:var(--cream); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
    main { max-width:620px; padding:clamp(2rem,6vw,4rem); text-align:center; border:1px solid rgba(119,72,38,.28); background:var(--card); box-shadow:0 24px 60px rgba(63,50,39,.1); }
    img { width:110px; height:110px; object-fit:contain; }
    h1 { margin:.75rem 0; font:400 clamp(2rem,6vw,3.4rem) 'Libre Caslon Display',Georgia,serif; }
    p { color:var(--muted); line-height:1.7; }
    a { display:inline-block; margin-top:1rem; padding:.85rem 1.5rem; color:var(--amber-ink); background:var(--amber); border-radius:3px; font-weight:700; text-decoration:none; box-shadow:0 5px 0 var(--amber-shadow); transition:transform .25s ease,box-shadow .25s ease; }
    a:hover { transform:translateY(-3px); box-shadow:0 8px 0 var(--amber-shadow),0 14px 20px rgba(63,50,39,.18); }
    a:focus-visible { outline:3px solid var(--rose); outline-offset:2px; border-radius:3px; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png?v=3-newlogo" alt="" width="110" height="110" />
    <h1>This template has retired.</h1>
    <p>The Keepsake Builder is now the single source of truth. It protects the required MP3, lyric-sheet, privacy, consent, and brand treatments from drifting apart.</p>
    <a href="keepsake-builder.html">Open the Keepsake Builder</a>
  </main>
</body>
</html>
